name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 语法与清单检查
        run: |
          python - <<'PY'
          import ast, json, pathlib, sys
          bad = 0
          for p in pathlib.Path("tools").glob("*.py"):
              try:
                  ast.parse(p.read_text(encoding="utf-8"))
              except SyntaxError as e:
                  print("FAIL", p, e); bad += 1
          pkg = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))
          need = ("name", "displayName", "description", "version", "publisher", "engines", "main")
          miss = [k for k in need if k not in pkg]
          if miss:
              print("package.json 缺少字段:", miss); bad += 1
          for f in ("extension.js", "README.md", "LICENSE",
                    "translations/main.i18n.json", "dist/devin-zh-dom.js"):
              if not pathlib.Path(f).exists():
                  print("缺少文件:", f); bad += 1
          print("OK", "%s.%s" % (pkg.get("publisher"), pkg.get("name")), pkg.get("version"))
          sys.exit(1 if bad else 0)
          PY

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          ver = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != "v" + ver:
              print("tag %s 与 package.json 的版本 %s 不一致，请先改 package.json" % (tag, ver))
              sys.exit(1)
          print("tag 与版本一致:", tag)
          PY

      - name: 打包
        run: python tools/build_vsix.py

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: build/*.vsix
          if-no-files-found: error

      - name: 发布 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVIN_PLUGIN_REPO: ${{ github.repository }}
        run: python tools/release.py
